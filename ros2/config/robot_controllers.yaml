# ============================================================
#  ros2_control controller configuration — ST3215 6-DOF Robot
# ============================================================
#
#  Контроллеры:
#    joint_state_broadcaster   — публикует /joint_states из hardware state
#    joint_trajectory_controller — принимает JointTrajectory, управляет позицией
#
#  Запуск:
#    ros2 launch robot_control ros2_control.launch.py
#
#  Ручное управление контроллерами:
#    ros2 control load_controller --set-state active joint_state_broadcaster
#    ros2 control load_controller --set-state active joint_trajectory_controller
#    ros2 control list_controllers
# ============================================================

controller_manager:
  ros__parameters:
    update_rate: 50   # Гц — частота цикла hardware read/write

    # Список контроллеров для автозагрузки
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# ──────────────────────────────────────────────────────────
# JointStateBroadcaster
#   Читает state_interfaces (position, velocity) из hardware
#   и публикует sensor_msgs/JointState на /joint_states
# ──────────────────────────────────────────────────────────
joint_state_broadcaster:
  ros__parameters:
    joints:
      - joint_0
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5

# ──────────────────────────────────────────────────────────
# JointTrajectoryController
#   Принимает action: FollowJointTrajectory
#   Topic:   /joint_trajectory_controller/joint_trajectory
#   Action:  /joint_trajectory_controller/follow_joint_trajectory
#   State:   /joint_trajectory_controller/state
# ──────────────────────────────────────────────────────────
joint_trajectory_controller:
  ros__parameters:
    joints:
      - joint_0
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5

    # Интерфейсы управления и состояния
    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    # Частота публикации состояния контроллера
    state_publish_rate: 50.0    # Гц

    # Частота мониторинга action-цели
    action_monitor_rate: 20.0   # Гц

    # Разрешить неполные цели (не все суставы)
    allow_partial_joints_goal: false

    # Разрешить интерполяцию между точками траектории
    allow_integration_in_goal_trajectories: true

    # Допуски выполнения траектории
    constraints:
      stopped_velocity_tolerance: 0.05   # рад/с
      goal_time: 0.0                     # 0 = без ограничения по времени

      joint_0:
        goal: 0.05       # рад — допуск достижения конечной точки
        trajectory: 0.2  # рад — допуск в ходе выполнения

      joint_1:
        goal: 0.05
        trajectory: 0.2

      joint_2:
        goal: 0.05
        trajectory: 0.2

      joint_3:
        goal: 0.05
        trajectory: 0.2

      joint_4:
        goal: 0.05
        trajectory: 0.2

      joint_5:
        goal: 0.05
        trajectory: 0.2
