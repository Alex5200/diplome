[project]
name = "diplome"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "pyserial>=3.5",
    "rich>=14.3.3",
    "ruff>=0.15.8",
    "st3215>=0.4.0",
    "textual>=8.2.0",
]

# ============================================================
#  Ruff — линтер и форматтер
# ============================================================

[tool.ruff]
target-version = "py312"
line-length = 100
fix = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",    # line too long (formatter handles it)
    "E402",    # module import not at top (Tkinter GUI patterns)
    "E741",    # ambiguous variable name (l, I — math context)
    "B008",    # function calls in argument defaults
    "B905",    # zip without strict (Python 3.10+ pattern)
    "SIM102",  # collapsible if (readability)
    "SIM105",  # suppressible exception
    "SIM108",  # use ternary operator (readability)
    "RUF001",  # ambiguous unicode (cyrillic OK)
    "RUF002",  # ambiguous unicode in docstrings
    "RUF003",  # ambiguous unicode in comments
    "RUF005",  # collection literal concatenation
    "RUF012",  # mutable class default (Tkinter widget patterns)
    "RUF013",  # implicit optional
    "N802",    # function name lowercase (ST3215 API)
    "N803",    # argument name lowercase
    "N806",    # variable lowercase (J, T matrices)
]

[tool.ruff.lint.isort]
known-first-party = ["app", "shared", "desktop", "web", "ros2", "programs"]

[tool.ruff.lint.per-file-ignores]
"app/tests/*" = ["F841", "B018"]       # unused variables OK in tests
"app/views/*" = ["F841", "B023"]       # GUI callbacks, loop variables
"main.py" = ["E402", "F401", "F841"]   # legacy monolith
